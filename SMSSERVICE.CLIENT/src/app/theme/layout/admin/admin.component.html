<app-navigation
  class="coded-navbar pc-sidebar"
  [ngClass]="{
    'navbar-collapsed': navCollapsed,
    'mob-open': navCollapsedMob
  }"
  (NavCollapsedMob)="navMobClick()"
></app-navigation>
<app-nav-bar (NavCollapse)="this.navCollapsed = !this.navCollapsed" (NavCollapsedMob)="navMobClick()"></app-nav-bar>
<div class="pc-container">
  <div class="coded-wrapper">
    <div class="coded-content">
      <div class="coded-inner-content">
        <app-breadcrumb></app-breadcrumb>
        <div class="main-body">
          <div class="page-wrapper">
            <router-outlet></router-outlet>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<footer class="pc-footer">
  <div class="footer-wrapper container-fluid">
    <div class="row">
      <div class="col my-1">
        <p class="m-0">
          <i class="ti ti-device-mobile me-2"></i>
          Copyright &copy; 2024 <strong>A2P SMS Service</strong> - Ethio Telecom
        </p>
      </div>
      <div class="col-auto my-1">
        <p class="m-0">
          Powered by <a href="#" class="text-primary fw-bold">DAFTech Computer Engineering</a>
        </p>
      </div>
    </div>
  </div>
</footer>
<app-configuration></app-configuration>
