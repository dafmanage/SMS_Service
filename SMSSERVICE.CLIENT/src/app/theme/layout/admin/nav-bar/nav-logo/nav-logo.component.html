<div class="m-header">
  <!-- [ Header Topbar ] start -->
  <a [routerLink]="['/default/']" class="b-brand">
    <!-- ========   A2P SMS Service Logo   ============ -->
    <div class="logo-container d-flex align-items-center">
      <div class="logo-icon me-2">
        <i class="ti ti-device-mobile text-primary" style="font-size: 24px;"></i>
      </div>
      <div class="logo-text">
        <span class="brand-name">A2P SMS Service</span>
        <small class="brand-subtitle">Ethio Telecom</small>
      </div>
    </div>
  </a>
 
  <!-- ======= Menu collapse Icon ===== -->
  <div class="pc-h-item">
    <a
      href="javascript:"
      class="pc-head-link head-link-secondary m-0 mobile-menu"
      [ngClass]="{ on: navCollapsed }"
      id="sidebar-hide mobile-collapse"
      (click)="navCollapse()"
    >
      <i class="ti ti-menu-2"></i>
    </a>
  </div>
</div>
<!-- [ Header ] end -->
