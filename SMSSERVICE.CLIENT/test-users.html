<!DOCTYPE html>
<html>
<head>
    <title>Test Users Endpoint</title>
</head>
<body>
    <h1>Test Users Endpoint</h1>
    <button onclick="testUsers()">Test Users</button>
    <div id="result"></div>

    <script>
        async function testUsers() {
            try {
                const response = await fetch('http://localhost:5267/api/Authentication/test-users');
                const data = await response.json();
                
                document.getElementById('result').innerHTML = `
                    <h2>Response:</h2>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                document.getElementById('result').innerHTML = `
                    <h2>Error:</h2>
                    <pre>${error.message}</pre>
                `;
            }
        }
    </script>
</body>
</html>
